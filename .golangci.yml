#
# Generated by @zondax/cli
#
version: "2"
run:
  timeout: 5m

linters:
  enable:
    - gosec
    - goconst
    - gocritic
    - staticcheck
    - gosimple
    - goconst
    - bodyclose
    - unconvert
    - unparam
    - unused
    - durationcheck
    - makezero
    - nilerr
    - reassign

formatters:
  enable:
    - gofmt